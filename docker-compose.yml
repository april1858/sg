version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: subscriptions_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-subscriptions_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-subscriptions_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    command: -path /app/migrations -database "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME:-subscriptions_db}?sslmode=disable" up
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy


  app:
    build: .
    container_name: subscription-aggregator
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-subscriptions_db}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
